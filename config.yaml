# Internship Watcher Configuration

settings:
  ntfy_topic: ""  # Set a private, newly generated topic using NTFY_TOPIC
  email: ""  # Legacy compatibility field; delivery is ntfy only
  request_delay_seconds: 1.5
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) InternshipWatcher/1.0"
  db_path: "job_state.db"

# Keyword Filters
filters:
  # Title must contain at least one of these (case-insensitive)
  role_keywords:
    - "intern"
    - "internship"
    - "co-op"
    - "coop"

  # Title must match one keyword, OR description must match two distinct keywords
  topic_keywords:
    - "power"
    - "analog"
    - "hardware"
    - "pcb"
    - "fpga"
    - "electrical"
    - "embedded"
    - "battery"
    - "validation"
    - "test"
    - "semiconductor"
    - "silicon"
    - "asic"
    - "vlsi"

  # Location filter: Must contain United States or Remote
  location_include:
    - "united states"
    - "us"
    - "usa"
    - "remote"

  # Flagging filter: If found in description, role is FLAGGED with warning badge (not dropped)
  visa_flag_keywords:
    - "u.s. citizen"
    - "us citizen"
    - "u.s. person"
    - "us person"
    - "security clearance"
    - "itar"
    - "export control"
    - "permanent resident"
    - "green card"
    - "without sponsorship"
    - "no sponsorship"

