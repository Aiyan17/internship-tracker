name: Daily Internship Watcher

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview matches without sending alerts or changing state
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: internship-watcher
  cancel-in-progress: false

jobs:
  check:
    # Forks can test manually but do not automatically publish notifications.
    if: github.event_name == 'workflow_dispatch' || github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JOB_DB_PATH: .state/job_state.db
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: .state/job_state.db
          key: job-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: job-state-v1-
      - name: Check internships
        shell: bash
        run: |
          set -o pipefail
          if [ "$DRY_RUN" = "true" ]; then
            python main.py --dry-run 2>&1 | tee watcher.log
          else
            python main.py 2>&1 | tee watcher.log
          fi
      - name: Save successfully notified jobs even if another source failed
        if: always() && env.DRY_RUN != 'true' && hashFiles('.state/job_state.db') != ''
        uses: actions/cache/save@v4
        with:
          path: .state/job_state.db
          key: job-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watcher-log
          path: watcher.log
          if-no-files-found: ignore
          retention-days: 7
